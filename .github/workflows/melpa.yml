# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test-melpa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 28.1
          - 28.2
          - 29.1
          - 29.2
          - 29.3
          - 29.4
          - 30.1
          - 31.1
        ignore_warnings:
          - false
        warnings_as_errors:
          - true
        check:
          - melpa
        file:
          - 'ellama*.el'
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - uses: leotaku/elisp-check@master
        with:
          check: ${{ matrix.check }}
          file: ${{ matrix.file }}
          ignore_warnings: ${{ matrix.ignore_warnings }}
          warnings_as_errors: ${{ matrix.warnings_as_errors }}
  check-manual:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: purcell/setup-emacs@master
        with:
          version: 30.1
      - name: Install Texinfo
        run: sudo apt-get update && sudo apt-get install -y texinfo
      - name: Generate manual
        run: make manual
      - name: Upload generated manual
        uses: actions/upload-artifact@v4
        with:
          name: generated-manual
          path: ellama.info
      - name: Commit generated manual for same-repository PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- ellama.info; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ellama.info
            git commit -m "Regenerate manual"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Check generated manual for read-only runs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: git diff --exit-code -- ellama.info

  test-ert:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 28.1
          - 28.2
          - 29.1
          - 29.2
          - 29.3
          - 29.4
          - 30.1
          - 31.1
        ignore_warnings:
          - false
        warnings_as_errors:
          - true
        check:
          - ert
        file:
          - 'tests/test*.el'
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - uses: leotaku/elisp-check@master
        with:
          check: ${{ matrix.check }}
          file: ${{ matrix.file }}
          ignore_warnings: ${{ matrix.ignore_warnings }}
          warnings_as_errors: ${{ matrix.warnings_as_errors }}
